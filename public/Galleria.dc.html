function r2(n) { return Math.round(n * 100) / 100; }
function hoogte(slot) { return slot.b * FOTO_VERHOUDING / LIJSTEN[slot.lijst].ratio; }
function midden(slot) { return slot.t != null ? slot.t + hoogte(slot) / 2 : slot.y; }

class Component extends DCLogic {
componentDidMount() {
  var self = this;
  // in de echte app: opnieuw tekenen zodra bekend is wie er is ingelogd
  if (window.Villa) this._uit = window.Villa.aan(function () { self.setState({ live: ((self.state && self.state.live) || 0) + 1 }); });
}
componentWillUnmount() {
  if (this._uit) this._uit();
}
renderVals() {
  var self = this;
  var SPELER = ikBen();
  var st = this.state || {};
  var muur = st.muur !== undefined ? st.muur : (this.props.muur ?? 0);
  var sel = st.sel !== undefined ? st.sel : (this.props.ritratto || null);

  // volgorde voor Vorige / Volgende: alle families, dan Don Vittorio
  var seq = [];
  WANDEN.forEach(function (w, wi) { w.slots.forEach(function (s) { seq.push({ id: s.p, wand: wi, slot: s, fam: w.sub ? w.sub : w.titel }); }); });
  seq.push({ id: 'vittorio', wand: null, slot: null, fam: 'Villa Bellandi' });
  var idx = {}; seq.forEach(function (s, i) { idx[s.id] = i; });
  var open = function (id) { return function () { self.setState({ sel: id }); }; };

  var muren = WANDEN.map(function (w, wi) {
    var d = wi - muur, actief = d === 0;
    return {
      titel: w.titel, kort: w.kort, foto: w.foto,
      verborgen: actief ? 'false' : 'true',
      tab: actief ? '0' : '-1',
      c: { isLetter: w.wapen === 'letter', letter: w.letter || '', isWolf: w.wapen === 'wolf', isAnchor: w.wapen === 'anker', isPavone: w.wapen === 'pavone', isBilancia: w.wapen === 'bilancia' },
      laag: 'position: absolute; inset: 0; ' + (actief ? 'opacity: 1; transform: none; pointer-events: auto' : d < 0 ? 'opacity: 0; transform: translateX(-3%) scale(1.02); pointer-events: none' : 'opacity: 0; transform: translateX(3%) scale(1.02); pointer-events: none'),
      slots: w.slots.map(function (s, k) {
        var pp = P[s.p], L = LIJSTEN[s.lijst], h = hoogte(s), plaatB = s.pb || Math.max(s.b, 13);
        var parts = pp.naam.split(' ');
        return {
          aria: pp.naam + ', portret openen',
          pick: open(s.p),
          portret: pp.portret, heeftPortret: !!pp.portret, geenPortret: !pp.portret,
          isTu: s.p === SPELER,
          masker: L.masker, lijstFoto: L.foto,
          plaatTekst: parts.slice(0, -1).join(' ') + '\n' + parts[parts.length - 1],
          knop: 'position: absolute; left: ' + r2(s.x - plaatB / 2) + '%; top: ' + r2(midden(s) - h / 2) + '%; width: ' + plaatB + '%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; cursor: pointer',
          lijstDoos: 'position: relative; display: block; width: ' + r2(s.b / plaatB * 100) + '%; aspect-ratio: ' + r2(L.ratio * 1000) + ' / 1000',
          glow: 'position: absolute; left: -28%; right: -28%; top: -9%; bottom: -10%; pointer-events: none; mix-blend-mode: screen; background: linear-gradient(180deg, rgba(255,214,150,0.38) 0%, rgba(255,214,150,0.07) 62%, rgba(0,0,0,0) 100%); clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%); opacity: ' + (actief ? 1 : 0) + '; transition-delay: ' + (actief ? (0.5 + k * 0.35) : 0) + 's',
          plaat: 'display: block; width: 100%; box-sizing: border-box; padding: 3px 4px; white-space: pre-line; text-align: center; font-family: \'Bodoni Moda\', serif; font-size: ' + (k === 0 ? 11 : 10) + 'px; line-height: 1.12; color: #2e1d0b; background: linear-gradient(160deg, #dcbd78 0%, #a47c40 55%, #c49c56 100%); box-shadow: 0 2px 5px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,236,190,0.5)'
        };
      }),
      ga: function () { self.setState({ muur: wi, sel: null }); },
      current: actief ? 'true' : 'false',
      navKnop: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; padding: 0; border: none; border-radius: 2px; cursor: pointer; ' + (actief ? 'background: radial-gradient(circle at 50% 40%, rgba(216,182,112,0.28) 0%, rgba(0,0,0,0) 70%)' : 'background: transparent'),

    };
  });

  var cur = sel != null && idx[sel] !== undefined ? seq[idx[sel]] : null;
  var zoomX = 50, zoomY = 45, zoom = 1;
  var r = { naam: '', familie: '', rol: '', tekst: '', portret: '', heeftPortret: false, geenPortret: true, isTu: false, rouw: false, teller: '', nummer: '', vorigeNaam: '', volgendeNaam: '', masker: 'm-barok', lijstFoto: LIJSTEN.barok.foto, doos: '' };
  var vorige = function () {}, volgende = function () {};
  if (cur) {
    var i = idx[sel], n = seq.length;
    var pv = seq[(i - 1 + n) % n], nx = seq[(i + 1) % n];
    var isV = cur.id === 'vittorio';
    var pp = isV ? VITTORIO : P[cur.id];
    var lijstNaam = isV ? 'barok' : cur.slot.lijst;
    var L = LIJSTEN[lijstNaam];
    var bw = Math.min(isV ? 250 : 236, (isV ? 316 : 300) * L.ratio);
    var naamVan = function (s) { return s.id === 'vittorio' ? VITTORIO.naam : P[s.id].naam; };
    r = {
      naam: pp.naam, familie: cur.fam, rol: pp.rol, tekst: pp.tekst,
      portret: pp.portret, heeftPortret: !!pp.portret, geenPortret: !pp.portret,
      isTu: cur.id === SPELER, rouw: isV,
      teller: (i + 1) + ' / ' + n,
      nummer: 'Ritratto n° ' + (i + 1 < 10 ? '0' : '') + (i + 1),
      vorigeNaam: naamVan(pv), volgendeNaam: naamVan(nx),
      masker: L.masker, lijstFoto: L.foto,
      doos: 'position: relative; display: block; height: min(100%, ' + (Math.round(bw) / (r2(L.ratio * 1000) / 1000)).toFixed(3) + 'px); aspect-ratio: ' + r2(L.ratio * 1000) + ' / 1000'
    };
    vorige = function () { self.setState({ sel: pv.id, muur: pv.wand === null ? muur : pv.wand }); };
    volgende = function () { self.setState({ sel: nx.id, muur: nx.wand === null ? muur : nx.wand }); };
    if (isV) { zoomX = 87; zoomY = 50; } else { zoomX = cur.slot.x; zoomY = midden(cur.slot); }
    zoom = 1.7;

    volgende: volgende,
    veegStart: function (e) { self._x = e.clientX; },
    veegEind: function (e) {
      if (self._x == null) return;
      var dx = e.clientX - self._x; self._x = null;
      var m = (self.state && self.state.muur !== undefined) ? self.state.muur : (self.props.muur ?? 0);
      if (dx < -40 && m < WANDEN.length - 1) self.setState({ muur: m + 1 });
      else if (dx > 40 && m > 0) self.setState({ muur: m - 1 });
    }
  };
